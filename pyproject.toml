[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recompyler"
version = "0.1.0"
description = "Profile Python scripts and test verified CPU and GPU speedups"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["python", "profiler", "compiler", "numba", "cuda", "gpu", "performance"]

[project.optional-dependencies]
compile = ["numba>=0.61", "numpy>=1.24"]

[project.scripts]
recompyler = "recompyler.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The vendored ahead-of-time compiler needs its C source and Numba's licence.
"recompyler._pycc" = ["modulemixin.c", "LICENSE.numba"]
